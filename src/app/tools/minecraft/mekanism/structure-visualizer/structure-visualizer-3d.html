<div class="visualizer3d" aria-live="polite">
  <div class="visualizer3d__controls">
    <label>
      <input
        type="checkbox"
        [checked]="showWalls()"
        [disabled]="!hasVolume()"
        (change)="onWallToggle($event)"
      />
      Show wall casings
    </label>
    <label>
      <input
        type="checkbox"
        [checked]="showOutlines()"
        [disabled]="!hasVolume()"
        (change)="onOutlineToggle($event)"
      />
      Show outlines
    </label>
    <label>
      <input
        type="checkbox"
        [checked]="showGrid()"
        [disabled]="!hasVolume()"
        (change)="onGridToggle($event)"
      />
      Show floor grid
    </label>
  </div>
  <div class="visualizer3d__viewport" #viewport>
    <canvas
      #canvas
      class="visualizer3d__canvas"
      role="img"
      aria-label="3D structure preview"
    ></canvas>
    <p class="visualizer3d__placeholder" *ngIf="!hasVolume()">
      3D preview will appear once a valid plan is available.
    </p>
  </div>
  <p class="visualizer3d__hint" *ngIf="hasVolume()">
    Drag to orbit · Scroll to zoom · Double click to reset view
  </p>
  <ul class="visualizer3d__legend" *ngIf="legend().length > 0">
    <li *ngFor="let entry of legend()">
      <span class="visualizer3d__legend-swatch" [style.background]="legendColor(entry)"></span>
      <span>{{ entry.label }}</span>
    </li>
  </ul>
</div>
